            <section class="cv-section" aria-labelledby="sec-hobbies">
              <h2 id="sec-hobbies" class="section-title">
                <span class="section-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                  </svg>
                </span>
                Centres d'intérêt
              </h2>
              <div class="hobby-grid">
                ${hobbiesHTML}
              </div>
            </section>
          </aside>
        </div>

        <footer class="cv-footer">
          <span>CV ${data.profile.name} • ${data.profile.role} • ${data.profile.location}</span>
          <span>${data.profile.availability}</span>
        </footer>
      `;
    }

    // Exécution du rendu immédiat
    renderCV(cvData);

    // Interaction du bouton "Copier email"
    document.getElementById('btn-copy-email').addEventListener('click', function() {
      const email = cvData.contact.email;
      navigator.clipboard.writeText(email).then(() => {
        const btnText = this.querySelector('.btn-text');
        const originalText = btnText.textContent;
        btnText.textContent = 'Email copié !';
        this.style.backgroundColor = '#059669';
        this.style.color = '#ffffff';
        setTimeout(() => {
          btnText.textContent = originalText;
          this.style.backgroundColor = '';
          this.style.color = '';
        }, 2200);
      }).catch(err => {
        alert('Email : ' + email);
      });
    });
  </script>

</body>
</html>
